<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
</head>
<body>
    <div id="test">Testing basic HTML load</div>
    <script>
        console.log('Basic HTML loaded successfully');
        document.getElementById('test').innerHTML = 'JavaScript executing correctly';
        
        // Test if we can reach the React app
        fetch('/src/main.tsx')
            .then(response => {
                console.log('Main.tsx fetch status:', response.status);
                return response.text();
            })
            .then(text => {
                console.log('Main.tsx content length:', text.length);
            })
            .catch(err => {
                console.error('Error fetching main.tsx:', err);
            });
    </script>
</body>
</html>
